{% extends "workshop/base.html" %}
{% block title %}Forgot Password{% endblock %}

{% block login_content %}
<div style="width:100%; max-width:480px;">
  <div class="card">
    <div class="card-title">Forgot Password</div>
    <form method="post">
      {% csrf_token %}
      <p>Enter the email associated with your account. We'll send a link to reset your password.</p>
      <div class="form-group">
        <label for="id_email">Email</label>
        <input type="email" name="email" id="id_email" required>
      </div>
      <button class="btn btn-primary" style="width:100%">Send reset link</button>
    </form>
  </div>
  <div style="text-align:center; margin-top:12px;"><a href="{% url 'login' %}">Back to login</a></div>
</div>
{% endblock %}
