{% extends "workshop/base.html" %}
{% block title %}Reset Password{% endblock %}

{% block login_content %}
<div style="width:100%; max-width:480px;">
  <div class="card">
    <div class="card-title">Reset Password</div>
    <form method="post">
      {% csrf_token %}
      <input type="hidden" name="token" value="{{ token }}">
      <div class="form-group">
        <label for="id_password">New password</label>
        <input type="password" name="password" id="id_password" required>
      </div>
      <div class="form-group">
        <label for="id_password_confirm">Confirm password</label>
        <input type="password" name="password_confirm" id="id_password_confirm" required>
      </div>
      <button class="btn btn-primary" style="width:100%">Reset password</button>
    </form>
  </div>
  <div style="text-align:center; margin-top:12px;"><a href="{% url 'login' %}">Back to login</a></div>
</div>
{% endblock %}
